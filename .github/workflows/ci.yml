name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Committed dist must match a fresh build
        run: |
          git add -N dist
          if ! git diff --exit-code --stat dist; then
            echo "::error::dist/ is stale or incomplete — run 'npm run build' and commit the result."
            exit 1
          fi

      - name: Committed contract artifacts must match a fresh forge build
        run: |
          npm run build:contracts
          if ! git diff --exit-code --stat src/contracts tests/contracts; then
            echo "::error::contract artifacts are stale — run 'npm run build:contracts' and commit the result."
            exit 1
          fi

      - name: Library tests
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
