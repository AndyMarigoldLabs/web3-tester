# Pinned, metadata-stripped build so the committed artifacts are
# byte-reproducible regardless of the maintainer's ambient toolchain.
[profile.default]
src = "."
out = "out"
libs = []
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
evm_version = "paris"
